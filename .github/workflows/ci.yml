name: checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  contracts:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-fund
      - run: npm run check
      - run: git diff --exit-code -- skill
      - name: Validate PowerShell syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem skill/scripts/*.ps1 | ForEach-Object {
            $syntaxErrors = $null
            $scriptTokens = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$scriptTokens,[ref]$syntaxErrors) | Out-Null
            if ($syntaxErrors.Count) { throw ($syntaxErrors | Out-String) }
          }
